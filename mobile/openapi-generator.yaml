# OpenAPI Generator configuration — reproduces the `gym_api` Dart package.
#
# Regenerate from `mobile/` with:
#   dart run openapi_generator_cli:main generate -c openapi-generator.yaml
#
# The `dart-dio` generator is driven by the `openapi_generator` pub package
# (v6.1.0) which shells out to the OpenAPI Generator CLI (v7.9.0) under Java 17.
inputSpec: ../backend/openapi.json
generatorName: dart-dio
outputDir: packages/gym_api
# The backend spec is now valid — every `{id}` path parameter is declared and
# request/response bodies `$ref` their registered components — so the
# generator's built-in spec validation passes and `--skip-validate-spec` is no
# longer required.
additionalProperties:
  pubName: gym_api
  pubVersion: 0.1.0
  pubDescription: "Typed Dart client for the Gym Management API (generated)."
  pubAuthor: Gym Manager
  pubPublishTo: none
  serializationLibrary: json_serializable
  # The stock `==`/`hashCode` template null-dereferences optional fields.
  # `equatable` generates `List<Object?>` props that are null-safe.
  equalityCheckMethod: equatable
