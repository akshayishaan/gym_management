include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    directives_ordering: true
    always_declare_return_types: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    # Generated client SDK — has its own analysis_options.yaml and is
    # analyzed via `dart analyze` inside packages/gym_api.
    - packages/gym_api/**
    - android/**
