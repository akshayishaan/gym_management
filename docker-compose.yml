services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gym_management
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_random_secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym_network

  mongo:
    image: mongo:7
    container_name: gym_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - gym_network

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: gym_seed
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gym_management
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@gym.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - SEED_GYM_NAME=${SEED_GYM_NAME:-My Gym}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - gym_network

volumes:
  mongo_data:

networks:
  gym_network:
    driver: bridge
