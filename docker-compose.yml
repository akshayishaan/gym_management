services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gym_management?replicaSet=rs0
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_random_secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - gym_network

  mongo:
    image: mongo:7
    container_name: gym_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - gym_network

  mongo-init:
    image: mongo:7
    container_name: gym_mongo_init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            if (rs.status().ok === 1) quit(0);
          } catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
          }
          const result = rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          if (!result.ok && result.codeName !== "AlreadyInitialized") quit(1);
        '
        until mongosh --host mongo:27017 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do
          sleep 1
        done
    restart: "no"
    networks:
      - gym_network

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    container_name: gym_seed
    environment:
      - MONGODB_URI=mongodb://mongo:27017/gym_management?replicaSet=rs0
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@gym.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - SEED_GYM_NAME=${SEED_GYM_NAME:-My Gym}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - gym_network

volumes:
  mongo_data:

networks:
  gym_network:
    driver: bridge
