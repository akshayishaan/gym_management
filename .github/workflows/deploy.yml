# =============================================================================
# Gym Management — CI/CD: build ARM64 backend image → push to GHCR → deploy to VM
#
# Flow:
#   1. build-and-push — build the NestJS backend for linux/arm64 (the Oracle
#      Cloud Ampere A1 VM is aarch64), push to GHCR tagged `latest` + the commit
#      SHA (SHA tag enables rollback).
#   2. deploy — SSH into the VM, pull the new image, restart the compose stack,
#      then poll the /health endpoint until it returns 200.
#
# The repo is PUBLIC, so GitHub Actions minutes are free and the VM can `git
# pull` the repo over HTTPS without auth. GHCR images for a public repo are
# anonymously pullable, but we still log in to avoid anonymous rate limits.
# =============================================================================

name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — build the ARM64 image and push it to GHCR.
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets buildx emulate linux/arm64 on the amd64 GitHub runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR. `github.repository` is already lowercase
      # (akshayishaan/gym_management), which GHCR requires for image names.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # The VM is Ampere aarch64 — build for linux/arm64 via QEMU.
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2 — SSH into the VM, pull the new image, restart, and health-check.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Fail fast on any command error; don't mask the deploy output.
          script: |
            set -e
            cd ~/gym_management/backend
            git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      # Poll the backend /health endpoint until it returns 200 (or time out).
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.SSH_HOST }}:3001/health"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 12 attempts." >&2
          exit 1
